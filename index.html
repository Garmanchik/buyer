html,body{height:100%;overflow:hidden}
body{

  display:flex;flex-direction:column;
  background:#0a1020;
}

body::after{
  content:'';position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(37,99,235,.38), transparent 55%),
    radial-gradient(ellipse at 90% 100%, rgba(226,48,72,.30), transparent 55%),
    linear-gradient(180deg, rgba(10,16,32,.72), rgba(10,16,32,.90));
}

/* scroll area */
#app{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom,20px);scrollbar-width:none}
#app::-webkit-scrollbar{display:none}

/* header */
.hdr{
  position:sticky;top:0;z-index:50;
  background:rgba(10,16,32,.78);border-bottom:1px solid var(--border);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  padding:12px 16px 0;flex-shrink:0;
}
.hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hdr-av{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,var(--green3),var(--green4));
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:800;color:#fff;flex-shrink:0;
}
.hdr-info{flex:1;min-width:0}
.hdr-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-bal{font-size:12px;color:var(--green);font-weight:600;margin-top:1px}
.hdr-lvl{
  background:linear-gradient(135deg,var(--green3),var(--green4));
  color:#fff;font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0;
}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;padding:8px 16px;
  font-size:13px;font-weight:600;color:var(--fg3);cursor:pointer;
  border:none;border-bottom:2px solid transparent;
  background:none;outline:none;white-space:nowrap;
  transition:color .2s,border-color .2s;
}
.tab.active{color:var(--green);border-bottom-color:var(--green)}

/* sections */
.sec{display:none;padding:16px}
.sec.active{display:block}

/* card */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.card-ttl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--fg3);margin-bottom:12px}

/* ─── Profile ─── */
.prof-hero{
  background:linear-gradient(135deg,rgba(37,99,235,.42),rgba(226,48,72,.38));
  border:1px solid var(--green3);border-radius:var(--radius);
  padding:20px 16px;margin-bottom:12px;
  position:relative;overflow:hidden;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.prof-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 70% 20%,var(--glow),transparent 60%);
  pointer-events:none;
}
.prof-av{
  width:64px;height:64px;border-radius:50%;
  background:linear-gradient(135deg,var(--green2),var(--green4));
  display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:900;color:#fff;
  margin:0 auto 10px;
  border:3px solid var(--green);
  box-shadow:0 0 20px var(--glow);
}
.prof-name{text-align:center;font-size:18px;font-weight:800;margin-bottom:4px}
.prof-rank{text-align:center;font-size:13px;color:var(--green);font-weight:600;margin-bottom:14px}
.xp-bg{height:6px;border-radius:3px;background:var(--bg3)}
.xp-fill{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--green3),var(--green));transition:width .6s ease}
.xp-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--fg3);margin-top:4px}
.prof-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.pst{background:var(--bg3);border-radius:var(--radius-s);padding:10px 8px;text-align:center}
.pst-v{font-size:16px;font-weight:800;color:var(--green)}
.pst-l{font-size:10px;color:var(--fg3);margin-top:2px;font-weight:500}
.ref-row{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px;
}
.ref-ico{
  width:36px;height:36px;border-radius:50%;
  background:var(--glow);border:1px solid var(--green3);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
}
.ref-ttl{font-size:13px;font-weight:700}
.ref-sub{font-size:12px;color:var(--fg3);margin-top:2px}
.arr{font-size:18px;color:var(--green)}

/* ─── Wheel ─── */
.wheel-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:8px 0 20px}
#wCanvas{border-radius:50%;box-shadow:0 0 40px var(--glow),0 0 80px #00080044;display:block}
.spin-btn{
  background:linear-gradient(135deg,var(--green2),var(--green3));
  color:#fff;font-size:16px;font-weight:800;

<!-- Настоящий Telegram WebApp SDK — ОБЯЗАТЕЛЕН, иначе не узнаем user_id -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Заглушка-фоллбэк только для превью в обычном браузере (если SDK выше не загрузился) -->
<script>
window.Telegram = window.Telegram || { WebApp: {
  ready: function(){}, expand: function(){},
  initDataUnsafe: {},
  close: function(){},
  BackButton: { show: function(){}, hide: function(){} },
} };
</script>
<script>
/* ── Telegram init ── */
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const userId   = tg?.initDataUnsafe?.user?.id   ?? null;
const userName = tg?.initDataUnsafe?.user?.first_name ?? 'Пользователь';

/* ── API ──
   BASE_URL = адрес бэкенда api.py через ngrok.
   Узнать: в окне ngrok строка "Forwarding" → https://xxxxx.ngrok-free.app
   Вставляй БЕЗ слэша в конце (лишние слэши срежутся сами).
*/
let BASE_URL = ''; // same-origin: мини-апп и /api на одном домене VPS (ngrok больше не нужен)
BASE_URL = BASE_URL.replace(/\/+$/, '');   // срезаем хвостовые слэши

async function apiFetch(path, opts = {}) {
  try {
    const r = await fetch(BASE_URL + path, {
      ...opts,
      headers: {
        'Content-Type': 'application/json',
        'ngrok-skip-browser-warning': 'true', // БЕЗ этого ngrok отдаёт HTML-заглушку вместо JSON
        ...(opts.headers || {})
      }
    });
    if (!r.ok) return null;
    // если прилетел не JSON (warning-страница ngrok) — не падаем молча
    const ct = r.headers.get('content-type') || '';
    if (!ct.includes('application/json')) {
      console.warn('API вернул не JSON:', ct, '→ проверь BASE_URL и ngrok');
      return null;
    }
    return await r.json();
  } catch (e) {
    console.warn('apiFetch error:', e, 'path=', path);
    return null;
  }
}

/* ── Level / rank system ──
   Каждые 100 куков = +1 уровень. Макс 999.
   Rank — визуальный титул по номеру уровня.
*/
const RANKS = [
  { min: 0,   label: '🌱 Новичок'  },
  { min: 2,   label: '🍪 Продавец' },
  { min: 3,   label: '⚡ Активист' },
  { min: 5,   label: '🔥 Профи'    },
  { min: 8,   label: '💎 Элита'    },
  { min: 10,  label: '👑 Легенда'  },
];

function getLevel(cookies) {
  return Math.min(999, Math.floor(cookies / 100) + 1);
}
function getXpInfo(cookies) {
  const lv = getLevel(cookies);
  if (lv >= 999) return { pct: 100, left: '∞' };
  const prev = (lv - 1) * 100;
  const next = lv * 100;
  const pct  = Math.round(((cookies - prev) / 100) * 100);
  return { pct, left: `${next - cookies} куков` };
}
function getRank(cookies) {
  const lv = getLevel(cookies);
  let r = RANKS[0];
  for (const rk of RANKS) if (lv >= rk.min) r = rk;
  return r;
}

/* ── Пустой профиль (показывается когда API недоступен) ── */
function emptyProfile() {
  return {
    username: userName,
    balance: 0, total_earned: 0, total_cookies: 0, daily_cookies: 0,
    total_sales: 0, referrals: [], referral_earnings: 0, history: [],
    wheel_spins: 0,
  };
}

/* ── Profile ── */
let profileCache = null;

async function loadProfile() {
  let d = null;
  if (userId) d = await apiFetch(`/api/profile?user_id=${userId}`);
  if (!d) d = emptyProfile();   // реальные нули вместо фейка
  profileCache = d;
  renderProfile(d);
}

function renderProfile(d) {
  const name    = d.username || userName || 'Cookie Money';
  const init    = name[0].toUpperCase();
  const cookies = d.total_cookies ?? 0;
  const earned  = d.total_earned  ?? 0;
  const sales   = d.total_sales   ?? 0;
  const refs    = d.referrals?.length ?? 0;
  const refE    = d.referral_earnings ?? 0;
  const bal     = d.balance ?? 0;
  const lv      = getLevel(cookies);
  const xp      = getXpInfo(cookies);
  const rank    = getRank(cookies);

  qs('#hAvatar').textContent = init;
  qs('#hName').textContent   = name;
  qs('#hBal').textContent    = `${bal.toFixed(2)} ₽`;
  qs('#hLvl').textContent    = `Lv ${lv}`;

  qs('#pAvatar').textContent = init;
  qs('#pName').textContent   = name;
  qs('#pRank').textContent   = rank.label;
  qs('#xpF').style.width     = xp.pct + '%';
  qs('#xpCur').textContent   = `${cookies} куков`;
  qs('#xpNxt').textContent   = `${xp.left} до ур. ${lv + 1}`;

  qs('#stCook').textContent  = cookies;
  qs('#stEarn').textContent  = `${earned.toFixed(0)} ₽`;
  qs('#stSale').textContent  = sales;
  qs('#refCnt').textContent  = `${refs} приглашённых`;
  qs('#refEarn').textContent = `${refE.toFixed(2)} ₽`;

  qs('#profLd').style.display  = 'none';
  qs('#profCnt').style.display = 'block';

  // После загрузки профиля пересчитываем доступность колеса
  refreshWheelAccess();
}

/* ── Wheel ──
   weight — обратно пропорционален ценности: чем больше приз, тем ниже вес.
   Формула: weight = BASE_WEIGHT / value  (нормализуется до 100% суммарно).
   Можно менять BASE_WEIGHT для общей крутости; конкретные веса — в PRIZES.
   WHEEL_MIN_COOKIES — минималка куков за день для доступа к спину.
   Обе константы тянутся с /api/wheel_settings (или берутся дефолт).
*/
const PRIZES = [
  { label:'2 ₽',   value:2,   color:'#1d4ed8', weight:50  },
  { label:'5 ₽',   value:5,   color:'#dc2626', weight:30  },
  { label:'7 ₽',   value:7,   color:'#1e3a8a', weight:22  },
  { label:'10 ₽',  value:10,  color:'#b91c1c', weight:16  },
  { label:'20 ₽',  value:20,  color:'#2563eb', weight:10  },
  { label:'25 ₽',  value:25,  color:'#991b1b', weight:8   },
  { label:'50 ₽',  value:50,  color:'#ef4444', weight:3   },
  { label:'100 ₽', value:100, color:'#1d4ed8', weight:1   },
];

/* Настройки колеса — перезапишутся из /api/wheel_settings при буте */
let WHEEL_MIN_COOKIES  = 50;   // для информации в тексте (сколько нужно на спин)
let WHEEL_COOKIES_PER_SPIN = 50;

const SPIN_CD = 24 * 3600 * 1000;
let wAngle = 0, wSpinning = false, cdInterval = null;

/* Взвешенный случайный выбор индекса по полю weight */
function weightedRandom(prizes) {
  const total = prizes.reduce((s, p) => s + p.weight, 0);
  let r = Math.random() * total;
  for (let i = 0; i < prizes.length; i++) {
    r -= prizes[i].weight;
    if (r <= 0) return i;
  }
  return prizes.length - 1;
}

function drawWheel(angle) {
  const cvs = qs('#wCanvas');
  const ctx = cvs.getContext('2d');
  const W = cvs.width, cx = W/2, cy = W/2, r = W/2 - 4;
  const n = PRIZES.length, arc = Math.PI * 2 / n;
  ctx.clearRect(0, 0, W, W);
  for (let i = 0; i < n; i++) {
    const a = angle + arc * i - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, a, a + arc);
    ctx.closePath();
    ctx.fillStyle = PRIZES[i].color;
    ctx.fill();
    ctx.strokeStyle = '#0a1020';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(a + arc / 2);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 13px Inter,sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(PRIZES[i].label, r - 8, 5);
    ctx.restore();
  }
  ctx.beginPath();
  ctx.arc(cx, cy, 22, 0, Math.PI * 2);
  ctx.fillStyle = '#0a1020';
  ctx.fill();
  ctx.strokeStyle = '#5aa2ff';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx, 5);
  ctx.lineTo(cx - 9, 20);
  ctx.lineTo(cx + 9, 20);
  ctx.closePath();
  ctx.fillStyle = '#ff5a6e';
  ctx.fill();
}
drawWheel(0);

/* Накопленные прокрутки из профиля */
function wheelSpins() {
  return profileCache?.wheel_spins ?? 0;
}

/* Обновляем счётчик спинов и кнопку */
function refreshWheelAccess() {
  const spins = wheelSpins();
  const ctr = qs('#spinCounter');
  const cnt = qs('#spinCount');
  if (ctr) {
    ctr.style.display = spins > 0 ? '' : 'none';
    if (cnt) cnt.textContent = spins;
  }

  let last = 0;
  try { last = +localStorage.getItem('wheelSpin') || 0; } catch {}
  const cdDiff = SPIN_CD - (Date.now() - last);
  const btn = qs('#spinBtn');
  const req = qs('#spinReq');

  clearInterval(cdInterval);

  if (spins <= 0) {
    btn.disabled = true;
    qs('#spinTmr').textContent = '';
    req.innerHTML = `Нет прокруток. Каждые <strong>${WHEEL_COOKIES_PER_SPIN}</strong> сданных куков = +1 🎡`;
    return;
  }

  if (cdDiff > 0 && last) {
    // На кулдауне
    btn.disabled = true;
    req.innerHTML = `<strong>${spins}</strong> прокруток накоплено — подожди КД`;
    cdInterval = setInterval(() => {
      const d = SPIN_CD - (Date.now() - last);
      if (d <= 0) { clearInterval(cdInterval); refreshWheelAccess(); return; }
      const h = String(Math.floor(d / 3600000)).padStart(2,'0');
      const m = String(Math.floor((d % 3600000) / 60000)).padStart(2,'0');
      const s = String(Math.floor((d % 60000) / 1000)).padStart(2,'0');
      qs('#spinTmr').textContent = `Следующий спин: ${h}:${m}:${s}`;
    }, 1000);
    return;
  }

  // КД прошёл, спины есть
  qs('#spinTmr').textContent = '';
  btn.disabled = false;
  req.innerHTML = `<strong>${spins}</strong> прокруток. Удачи! 🎯`;
}

function spinWheel() {
  if (wSpinning) return;
  if (wheelSpins() <= 0) {
    toast(`🎡 Нет прокруток — сдай куки чтобы заработать`);
    return;
  }
  wSpinning = true;
  qs('#spinBtn').disabled = true;

  const n = PRIZES.length, arc = Math.PI * 2 / n;
  const prizeIdx = weightedRandom(PRIZES);
  const rotations = 5;
  const delta = Math.PI * 2 * rotations - prizeIdx * arc;
  const start = wAngle, dur = 4200;
  let t0 = null;
  function ease(t) { return 1 - Math.pow(1 - t, 4); }
  function frame(ts) {
    if (!t0) t0 = ts;
    const p = Math.min((ts - t0) / dur, 1);
    wAngle = start + delta * ease(p);
    drawWheel(wAngle);
    if (p < 1) { requestAnimationFrame(frame); return; }
    wAngle %= Math.PI * 2;
    wSpinning = false;

    const prize = PRIZES[prizeIdx];

    // Фиксируем на сервере (потребляет 1 прокрутку, начисляет баланс)
    if (userId) {
      apiFetch('/api/wheel_spin', {
        method: 'POST',
        body: JSON.stringify({
          user_id:     userId,
          prize_label: prize.label,
          prize_value: prize.value,
        })
      }).then(res => {
        if (res?.ok) {
          // Обновляем профиль локально
          if (profileCache) {
            profileCache.balance = (profileCache.balance ?? 0) + prize.value;
            qs('#hBal').textContent = `${profileCache.balance.toFixed(2)} ₽`;
            // Уменьшаем счётчик прокруток (сервер уже списал)
            profileCache.wheel_spins = res.spins_left ?? Math.max(0, (profileCache.wheel_spins ?? 0) - 1);
          }
          loadWheelWins();
          try { localStorage.setItem('wheelSpin', Date.now()); } catch {}
          refreshWheelAccess();
          toast(`🎉 Вы выиграли ${prize.label}! +${prize.value} ₽`);
        } else {
          toast('❌ Нет прокруток или кулдаун');
          refreshWheelAccess();
        }
      });
    } else {
      // Нет userId — просто показываем без записи
      try { localStorage.setItem('wheelSpin', Date.now()); } catch {}
      refreshWheelAccess();
      toast(`🎉 Вы выиграли ${prize.label}!`);
    }
  }
  requestAnimationFrame(frame);
}

qs('#spinBtn').addEventListener('click', spinWheel);
refreshWheelAccess();

/* ── Лента последних выигрышей (реальные данные с сервера) ── */
function renderWins(wins) {
  const el = qs('#winsList');
  if (!wins.length) {
    el.innerHTML = '<div style="color:var(--fg3);text-align:center;padding:20px;font-size:13px">Выигрышей пока нет</div>';
    return;
  }
  el.innerHTML = '';
  for (const w of wins) {
    const name = w.username || '???';
    const row = document.createElement('div');
    row.className = 'win-row';
    row.innerHTML = `
      <div class="win-av">${name[0].toUpperCase()}</div>
      <div class="win-name">${name}</div>
      <div class="win-prize">${w.prize}</div>`;
    el.appendChild(row);
  }
}

async function loadWheelWins() {
  const wins = await apiFetch('/api/wheel_wins?limit=20');
  renderWins(wins ?? []);
}

/* ── Tasks ── */
const ICONS = { sell_cookies:'🍪', sell_amount:'💰', invite_refs:'👥', make_withdraw:'💸' };
let tasksCache = [];

async function loadTasks() {
  const url = userId ? `/api/tasks?user_id=${userId}` : '/api/tasks';
  const d = await apiFetch(url);
  tasksCache = d ?? [];
  renderTasks();
}

function renderTasks() {
  const el = qs('#taskList');
  if (!tasksCache.length) {
    el.innerHTML = '<div class="tasks-empty"><div class="em">📭</div>Заданий пока нет.<br>Скоро появятся новые!</div>';
    return;
  }
  el.innerHTML = '';
  for (const t of tasksCache) {
    const pct  = Math.min(100, Math.round((t.progress / t.goal) * 100));
    const done = t.progress >= t.goal;
    const ico  = ICONS[t.type] || '📌';
    const c = document.createElement('div');
    c.className = 'task-card' + (done && !t.claimed ? ' done' : '') + (t.claimed ? ' claimed' : '');
    c.innerHTML = `
      <div class="task-top">
        <div class="task-ico">${ico}</div>
        <div class="task-info">
          <div class="task-ttl">${t.title}</div>
          <div class="task-dsc">${t.description || ''}</div>
        </div>
        <div class="task-rwd">+${t.reward} ₽</div>
      </div>
      <div class="tpb"><div class="tpbf" style="width:${pct}%"></div></div>
      <div class="tpr">
        <span class="tpt">${t.progress} / ${t.goal}</span>
        <span class="tpt">${pct}%</span>
      </div>
      ${done && !t.claimed ? `<button class="tclaim" data-id="${t.id}">Забрать награду</button>` : ''}
      ${t.claimed ? `<button class="tclaim done-btn" disabled>✓ Получено</button>` : ''}
    `;
    el.appendChild(c);
  }
  el.querySelectorAll('.tclaim:not(.done-btn)').forEach(b => {
    b.addEventListener('click', () => claimTask(b.dataset.id));
  });
}

async function claimTask(id) {
  let res = null;
  if (userId) res = await apiFetch('/api/claim', {
    method: 'POST',
    body: JSON.stringify({ user_id: userId, task_id: id })
  });
  if (res?.ok || !userId) {
    const t = tasksCache.find(x => x.id === id);
    if (t) {
      const rwd = res?.reward ?? t.reward;
      t.claimed = true;
      toast(`✅ Получено +${rwd} ₽!`);
      if (profileCache) {
        profileCache.balance = (profileCache.balance ?? 0) + rwd;
        qs('#hBal').textContent = `${profileCache.balance.toFixed(2)} ₽`;
      }
      renderTasks();
    }
  } else {
    toast('❌ Не удалось получить награду');
  }
}

// daily reset countdown removed

/* ── History ── */
async function loadHistory() {
  let d = null;
  if (userId) d = await apiFetch(`/api/profile?user_id=${userId}`);
  const hist = (d?.history ?? []).slice().reverse();
  renderHistory(hist);
}

function renderHistory(items) {
  const el = qs('#histList');
  if (!items.length) {
    el.innerHTML = '<div style="color:var(--fg3);text-align:center;padding:30px">История пуста</div>';
    return;
  }
  el.innerHTML = '';
  for (const h of items.slice(0, 50)) {
    const plus = h.amount > 0;
    const ico  = h.type === 'withdraw' ? '💸' : h.type === 'task' ? '🏆' : '🍪';
    const ttl  = h.type === 'sale'     ? `Продано ${h.cookies ?? '?'} куков`
               : h.type === 'task'     ? (h.title ?? 'Задание')
               : 'Вывод средств';
    const row = document.createElement('div');
    row.className = 'h-item';
    row.innerHTML = `
      <div class="h-ico">${ico}</div>
      <div class="h-info">
        <div class="h-ttl">${ttl}</div>
        <div class="h-t">${relTime(h.time)}</div>
      </div>
      <div class="h-amt${plus ? '' : ' neg'}">${plus ? '+' : ''}${(h.amount ?? 0).toFixed(2)} ₽</div>`;
    el.appendChild(row);
  }
}

function relTime(iso) {
  if (!iso) return '';
  const d = Date.now() - new Date(iso);
  if (d < 60000) return 'только что';
  if (d < 3600000) return `${Math.floor(d/60000)} мин. назад`;
  if (d < 86400000) return `${Math.floor(d/3600000)} ч. назад`;
  return new Date(iso).toLocaleDateString('ru-RU', { day:'numeric', month:'short' });
}

/* ── Stats (публичная — видна всем) ── */
async function loadStats() {
  const d = await apiFetch('/api/stats');
  renderStats(d);
}
function renderStats(d) {
  const el = qs('#statList');
  if (!d || !Array.isArray(d.tiers)) {
    el.innerHTML = '<div class="tasks-empty"><div class="em">📊</div>Статистика пока недоступна</div>';
    qs('#stTotalCnt').textContent = '0';
    qs('#stTotalSum').textContent = '0';
    return;
  }
  qs('#stTotalCnt').textContent = d.total_count ?? 0;
  qs('#stTotalSum').textContent = (d.total_sum ?? 0).toFixed(2);
  el.innerHTML = '';
  for (const t of d.tiers) {
    const row = document.createElement('div');
    row.className = 'stat-row';
    row.innerHTML = `
      <div class="stat-price">${t.price}₽</div>
      <div class="stat-info">
        <div class="stat-lbl">${t.label}</div>
        <div class="stat-sub">за всё время</div>
      </div>
      <div class="stat-cnt">
        <div class="stat-cnt-v">${t.count} шт.</div>
        <div class="stat-cnt-s">${(t.sum ?? 0).toFixed(2)} ₽</div>
      </div>`;
    el.appendChild(row);
  }
}

/* ── Tabs ── */
const loaded = { profile: false, wheel: false, tasks: false, stats: false, history: false };

qs('#tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  const tab = btn.dataset.tab;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
  document.querySelectorAll('.sec').forEach(s => s.classList.toggle('active', s.id === 'sec-' + tab));
  if (!loaded[tab]) {
    loaded[tab] = true;
    if (tab === 'wheel')   loadWheelWins();
    if (tab === 'tasks')   loadTasks();
    if (tab === 'stats')   loadStats();
    if (tab === 'history') loadHistory();
  }
});

/* ── Helpers ── */
function qs(s) { return document.querySelector(s); }
function toast(msg) {
  const t = qs('#toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

/* ── Boot ── */
loadProfile();
loadTasks();
loadWheelWins();

// Настройки колеса
apiFetch('/api/wheel_settings').then(s => {
  if (s?.min_cookies != null)      WHEEL_MIN_COOKIES      = s.min_cookies;
  if (s?.cookies_per_spin != null) WHEEL_COOKIES_PER_SPIN = s.cookies_per_spin;
  refreshWheelAccess();
});
</script>

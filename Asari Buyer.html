<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
/* ── tokens ──────────────────────────────────────────────────── */
:root {
  /* forest dark palette — deliberate, not generic */
  --bg:        #0d1410;
  --bg2:       #141d18;
  --bg3:       #1a2620;
  --surface:   rgba(20, 30, 24, 0.72);
  --border:    rgba(80, 150, 100, 0.18);
  --fg:        #e8ede9;
  --fg2:       #9ab8a4;
  --fg3:       #637a6c;
  --accent:    #5fcf82;
  --accent2:   #3a9e5f;
  --warn:      #e8a84a;
  --danger:    #d96060;

  --ff-head:   'Syne', system-ui, sans-serif;
  --ff-body:   'Inter', system-ui, sans-serif;

  color-scheme: dark;
}

/* only dark intentionally — single-theme, forest night */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  overflow-x: hidden;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--ff-body);
  font-size: 15px;
  line-height: 1.6;
  padding-inline: 0;
  padding-block: 0;
  min-height: 100%;
}

/* ── forest background ───────────────────────────────────────── */
.bg-forest {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}

.bg-forest canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.bg-blur {
  position: absolute;
  inset: 0;
  backdrop-filter: blur(0px);
  background: linear-gradient(
    to bottom,
    rgba(13,20,16,0.45) 0%,
    rgba(13,20,16,0.75) 60%,
    rgba(13,20,16,0.95) 100%
  );
}

/* ── layout ──────────────────────────────────────────────────── */
.app {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
  padding-inline: 20px;
  padding-block: env(safe-area-inset-top, 16px) env(safe-area-inset-bottom, 16px);
  gap: 0;
}

/* ── header ──────────────────────────────────────────────────── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-block: 20px 12px;
}

.logo {
  font-family: var(--ff-head);
  font-size: 22px;
  font-weight: 800;
  color: var(--fg);
  letter-spacing: -0.5px;
}

.logo span { color: var(--accent); }

.header-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--bg3);
  border: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
}

/* ── balance card ────────────────────────────────────────────── */
.balance-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px 24px 20px;
  margin-block: 4px 20px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: relative;
  overflow: hidden;
}

.balance-card::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 140px; height: 140px;
  background: radial-gradient(circle, rgba(95,207,130,0.12) 0%, transparent 70%);
  pointer-events: none;
}

.balance-label {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg3);
  margin-bottom: 6px;
}

.balance-amount {
  font-family: var(--ff-head);
  font-size: 42px;
  font-weight: 800;
  color: var(--fg);
  letter-spacing: -1.5px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.balance-amount .currency {
  font-size: 22px;
  color: var(--fg2);
  font-weight: 600;
  margin-left: 4px;
}

.balance-meta {
  display: flex;
  gap: 20px;
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.balance-meta-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.balance-meta-item .m-label {
  font-size: 11px;
  color: var(--fg3);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  font-weight: 600;
}

.balance-meta-item .m-val {
  font-size: 15px;
  font-weight: 600;
  color: var(--fg2);
  font-variant-numeric: tabular-nums;
}

/* ── tabs ────────────────────────────────────────────────────── */
.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 20px;
}

.tab {
  flex: 1;
  padding: 10px 8px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 12px;
  font-family: var(--ff-body);
  font-size: 13px;
  font-weight: 600;
  color: var(--fg3);
  cursor: pointer;
  text-align: center;
  transition: all 0.18s ease;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}

.tab.active {
  background: var(--accent2);
  border-color: var(--accent);
  color: var(--fg);
}

/* ── section label ───────────────────────────────────────────── */
.section-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--fg3);
  margin-bottom: 10px;
}

/* ── task card ───────────────────────────────────────────────── */
.task-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px 18px 16px;
  margin-bottom: 10px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.task-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.task-title {
  font-family: var(--ff-head);
  font-size: 16px;
  font-weight: 700;
  color: var(--fg);
  line-height: 1.25;
  text-wrap: balance;
}

.task-reward {
  background: rgba(95,207,130,0.12);
  border: 1px solid rgba(95,207,130,0.25);
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

.task-desc {
  font-size: 13px;
  color: var(--fg2);
  margin-bottom: 12px;
  line-height: 1.45;
}

.progress-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
}

.progress-bar {
  flex: 1;
  height: 5px;
  background: var(--bg3);
  border-radius: 99px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--accent2), var(--accent));
  transition: width 0.6s cubic-bezier(.4,0,.2,1);
}

.progress-text {
  font-size: 12px;
  font-weight: 600;
  color: var(--fg3);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  min-width: 48px;
  text-align: right;
}

.claim-btn {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  background: var(--accent2);
  border: 1px solid var(--accent);
  border-radius: 12px;
  font-family: var(--ff-head);
  font-size: 14px;
  font-weight: 700;
  color: var(--fg);
  cursor: pointer;
  transition: opacity 0.15s;
  -webkit-tap-highlight-color: transparent;
  outline: none;
  letter-spacing: 0.02em;
}

.claim-btn:active { opacity: 0.75; }

.done-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  margin-top: 10px;
}

/* ── history list ────────────────────────────────────────────── */
.history-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  margin-bottom: 8px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.hist-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: rgba(95,207,130,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  flex-shrink: 0;
}

.hist-info { flex: 1; min-width: 0; }

.hist-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--fg);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hist-date {
  font-size: 12px;
  color: var(--fg3);
}

.hist-amount {
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

/* ── stats grid ──────────────────────────────────────────────── */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.stat-tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.stat-icon { font-size: 22px; margin-bottom: 8px; }

.stat-val {
  font-family: var(--ff-head);
  font-size: 26px;
  font-weight: 800;
  color: var(--fg);
  letter-spacing: -0.5px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.stat-name {
  font-size: 12px;
  color: var(--fg3);
  margin-top: 4px;
  font-weight: 500;
}

/* ── panels ──────────────────────────────────────────────────── */
.panel { display: none; }
.panel.active { display: block; }

/* ── empty state ─────────────────────────────────────────────── */
.empty {
  text-align: center;
  padding: 48px 0 32px;
  color: var(--fg3);
}
.empty-icon { font-size: 36px; margin-bottom: 10px; }
.empty-text { font-size: 14px; }

/* ── bottom nav ──────────────────────────────────────────────── */
.bottom-nav {
  position: sticky;
  bottom: env(safe-area-inset-bottom, 0px);
  margin-inline: -20px;
  padding: 12px 20px calc(env(safe-area-inset-bottom, 0px) + 8px);
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}

/* scrollable content area */
.content {
  flex: 1;
  overflow-y: auto;
  padding-bottom: 8px;
}

/* ── toast ───────────────────────────────────────────────────── */
.toast {
  position: fixed;
  top: calc(env(safe-area-inset-top, 16px) + 16px);
  left: 50%; transform: translateX(-50%);
  background: var(--accent2);
  color: var(--fg);
  font-size: 14px;
  font-weight: 600;
  padding: 10px 22px;
  border-radius: 100px;
  white-space: nowrap;
  pointer-events: none;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.2s;
}
.toast.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  .progress-fill, .claim-btn, .tab, .toast { transition: none; }
}
</style>

<script>
// ── Telegram Web App init ──────────────────────────────────────
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#0d1410');
  tg.setBackgroundColor('#0d1410');
}

const user = tg?.initDataUnsafe?.user ?? null;
const userId = user?.id ?? null;

// avatar emoji from first name
if (user?.first_name) {
  document.getElementById('avatarEl').textContent =
    user.first_name[0].toUpperCase();
}

// ── Forest canvas ──────────────────────────────────────────────
(function drawForest() {
  const canvas = document.getElementById('forestCanvas');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    draw();
  }

  function drawTree(x, baseY, h, w, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    // trunk
    ctx.fillStyle = '#0f1a13';
    ctx.fillRect(x - w * 0.06, baseY - h * 0.3, w * 0.12, h * 0.32);
    // layers
    const layers = 4;
    for (let i = 0; i < layers; i++) {
      const ly = baseY - h * (0.2 + i * 0.22);
      const lw = w * (1 - i * 0.18);
      const lh = h * 0.32;
      ctx.beginPath();
      ctx.moveTo(x, ly - lh);
      ctx.lineTo(x + lw / 2, ly);
      ctx.lineTo(x - lw / 2, ly);
      ctx.closePath();
      const g = ctx.createLinearGradient(x - lw/2, ly - lh, x + lw/2, ly);
      g.addColorStop(0, `rgba(18,38,24,${0.9 - i*0.08})`);
      g.addColorStop(1, `rgba(12,28,17,${0.95 - i*0.06})`);
      ctx.fillStyle = g;
      ctx.fill();
    }
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // ground gradient
    const ground = ctx.createLinearGradient(0, H * 0.65, 0, H);
    ground.addColorStop(0, 'rgba(10,20,14,0)');
    ground.addColorStop(1, 'rgba(8,16,11,0.6)');
    ctx.fillStyle = ground;
    ctx.fillRect(0, H * 0.65, W, H * 0.35);

    // distant fog layer
    const fog = ctx.createLinearGradient(0, H * 0.25, 0, H * 0.75);
    fog.addColorStop(0, 'rgba(22,50,32,0.22)');
    fog.addColorStop(1, 'rgba(10,22,14,0)');
    ctx.fillStyle = fog;
    ctx.fillRect(0, H * 0.25, W, H * 0.5);

    // moonlight
    const moon = ctx.createRadialGradient(W * 0.72, H * 0.12, 0, W * 0.72, H * 0.12, H * 0.45);
    moon.addColorStop(0, 'rgba(120,200,140,0.10)');
    moon.addColorStop(0.5, 'rgba(50,120,70,0.04)');
    moon.addColorStop(1, 'transparent');
    ctx.fillStyle = moon;
    ctx.fillRect(0, 0, W, H);

    // stars
    ctx.save();
    for (let i = 0; i < 55; i++) {
      const sx = (Math.sin(i * 137.5) * 0.5 + 0.5) * W;
      const sy = (Math.sin(i * 97.3) * 0.5 + 0.5) * H * 0.55;
      const sr = 0.5 + (i % 3) * 0.4;
      ctx.globalAlpha = 0.15 + (i % 5) * 0.05;
      ctx.beginPath();
      ctx.arc(sx, sy, sr, 0, Math.PI * 2);
      ctx.fillStyle = '#c8f0d8';
      ctx.fill();
    }
    ctx.restore();

    // background trees (small, misty)
    const bgTrees = Math.ceil(W / 42);
    for (let i = 0; i < bgTrees; i++) {
      const tx = (i / bgTrees) * W * 1.05 - W * 0.025;
      const th = H * (0.28 + ((i * 73) % 100) / 100 * 0.14);
      const tw = th * 0.38;
      const ty = H * 0.72 + ((i * 37) % 100) / 100 * H * 0.06;
      drawTree(tx, ty, th, tw, 0.18 + ((i * 53) % 100) / 100 * 0.10);
    }

    // foreground trees
    const fgCount = Math.ceil(W / 110);
    for (let i = 0; i <= fgCount; i++) {
      const tx = (i / fgCount) * W * 1.1 - W * 0.05;
      const th = H * (0.48 + ((i * 89) % 100) / 100 * 0.18);
      const tw = th * 0.42;
      const ty = H * 0.88 + ((i * 61) % 100) / 100 * H * 0.04;
      drawTree(tx, ty, th, tw, 0.55 + ((i * 47) % 100) / 100 * 0.20);
    }

    // ground mist
    const mist = ctx.createLinearGradient(0, H * 0.78, 0, H);
    mist.addColorStop(0, 'rgba(30,60,38,0.12)');
    mist.addColorStop(0.5, 'rgba(20,45,28,0.22)');
    mist.addColorStop(1, 'rgba(13,20,16,0.5)');
    ctx.fillStyle = mist;
    ctx.fillRect(0, H * 0.78, W, H * 0.22);
  }

  resize();
  window.addEventListener('resize', resize);
})();

// ── Tab switching ──────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

// ── Toast ──────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── Format helpers ─────────────────────────────────────────────
function fmtRub(n) {
  return n.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ₽';
}
function fmtNum(n) { return n.toLocaleString('ru-RU'); }

// ── Render profile ─────────────────────────────────────────────
function renderProfile(data) {
  document.getElementById('balanceEl').innerHTML =
    fmtNum(Math.floor(data.balance || 0)) + '<span class="currency">₽</span>';
  document.getElementById('totalCookiesEl').textContent = fmtNum(data.total_cookies || 0);
  document.getElementById('totalEarnedEl').textContent = fmtRub(data.total_earned || 0);
  document.getElementById('withdrawnEl').textContent = fmtRub(data.withdrawn || 0);
}

// ── Render tasks ───────────────────────────────────────────────
function renderTasks(tasks) {
  const el = document.getElementById('tasksList');
  if (!tasks.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🌿</div><div class="empty-text">Заданий пока нет</div></div>';
    return;
  }
  el.innerHTML = tasks.map(t => {
    const pct = t.goal > 0 ? Math.min(100, Math.round(t.progress / t.goal * 100)) : (t.progress >= 1 ? 100 : 0);
    const done = t.claimed;
    const ready = !done && pct >= 100;

    return `<div class="task-card">
      <div class="task-header">
        <div class="task-title">${esc(t.title)}</div>
        <div class="task-reward">+${fmtRub(t.reward)}</div>
      </div>
      <div class="task-desc">${esc(t.description)}</div>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-text">${t.goal > 0 ? fmtNum(t.progress) + ' / ' + fmtNum(t.goal) : (pct >= 100 ? '✓' : '—')}</div>
      </div>
      ${ready ? `<button class="claim-btn" data-tid="${esc(t.id)}">✦ Забрать ${fmtRub(t.reward)}</button>` : ''}
      ${done ? `<div class="done-badge">✦ Получено</div>` : ''}
    </div>`;
  }).join('');

  el.querySelectorAll('.claim-btn').forEach(btn => {
    btn.addEventListener('click', () => claimTask(btn.dataset.tid, btn));
  });
}

// ── Render history ─────────────────────────────────────────────
function renderHistory(history) {
  const el = document.getElementById('historyList');
  if (!history.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📦</div><div class="empty-text">Продаж ещё не было</div></div>';
    return;
  }
  const items = [...history].reverse().slice(0, 30);
  el.innerHTML = items.map(h => {
    const d = h.date ? new Date(h.date).toLocaleDateString('ru-RU') : '—';
    return `<div class="history-item">
      <div class="hist-icon">🍪</div>
      <div class="hist-info">
        <div class="hist-title">${esc(h.username || 'аккаунт')}</div>
        <div class="hist-date">${d}</div>
      </div>
      <div class="hist-amount">+${fmtRub(h.amount || 0)}</div>
    </div>`;
  }).join('');
}

// ── Render stats ───────────────────────────────────────────────
function renderStats(data) {
  const tiles = [
    { icon: '🍪', val: fmtNum(data.total_cookies || 0), name: 'Сдано куков' },
    { icon: '💸', val: fmtRub(data.total_earned || 0), name: 'Всего заработано' },
    { icon: '📤', val: fmtRub(data.withdrawn || 0), name: 'Выведено' },
    { icon: '👥', val: fmtNum((data.referrals || []).length), name: 'Рефералов' },
  ];
  document.getElementById('statsGrid').innerHTML = tiles.map(t =>
    `<div class="stat-tile">
      <div class="stat-icon">${t.icon}</div>
      <div class="stat-val">${t.val}</div>
      <div class="stat-name">${t.name}</div>
    </div>`
  ).join('');
}

// ── Escape ─────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ── Claim task ─────────────────────────────────────────────────
async function claimTask(taskId, btn) {
  if (!userId) { showToast('Открой через Telegram-бот'); return; }
  btn.disabled = true;
  btn.textContent = '...';
  try {
    const r = await fetch(`/api/claim?user_id=${userId}&task_id=${encodeURIComponent(taskId)}`);
    if (!r.ok) throw new Error('err');
    const j = await r.json();
    if (j.ok) {
      showToast('✦ +' + fmtRub(j.reward) + ' зачислено!');
      loadData();
    } else {
      showToast(j.reason || 'Нельзя забрать');
      btn.disabled = false;
      btn.textContent = '✦ Забрать';
    }
  } catch {
    showToast('Ошибка сети');
    btn.disabled = false;
    btn.textContent = '✦ Забрать';
  }
}

// ── Load data ──────────────────────────────────────────────────
async function loadData() {
  if (!userId) {
    // demo mode — show example data
    const demo = {
      balance: 1247.50,
      total_earned: 8430.00,
      withdrawn: 7182.50,
      total_cookies: 312,
      referrals: [{}, {}],
      history: [
        { username: 'xXxRobloxKing', amount: 42.30, date: '2026-10-10T14:22:00' },
        { username: 'ProPlayer2025',  amount: 18.90, date: '2026-10-10T11:05:00' },
        { username: 'GamerDude99',    amount: 31.50, date: '2026-10-09T22:14:00' },
        { username: 'CoolUser_42',    amount: 55.20, date: '2026-10-09T17:33:00' },
      ]
    };
    const demoTasks = [
      { id: '1', title: 'Первая продажа', description: 'Сдай свои первые куки в систему', goal: 1, progress: 1, claimed: false, reward: 50 },
      { id: '2', title: 'Ветеран', description: 'Сдай 100 куков суммарно', goal: 100, progress: 64, claimed: false, reward: 200 },
      { id: '3', title: 'Реферал', description: 'Пригласи 1 друга по своей ссылке', goal: 1, progress: 0, claimed: false, reward: 100 },
    ];
    renderProfile(demo);
    renderTasks(demoTasks);
    renderHistory(demo.history);
    renderStats(demo);
    return;
  }

  try {
    const [profileRes, tasksRes] = await Promise.all([
      fetch(`/api/profile?user_id=${userId}`),
      fetch(`/api/tasks?user_id=${userId}`),
    ]);
    if (profileRes.ok) {
      const data = await profileRes.json();
      renderProfile(data);
      renderHistory(data.history || []);
      renderStats(data);
    }
    if (tasksRes.ok) {
      const tasks = await tasksRes.json();
      renderTasks(tasks);
    }
  } catch {
    showToast('Не удалось загрузить данные');
  }
}

loadData();
</script>
